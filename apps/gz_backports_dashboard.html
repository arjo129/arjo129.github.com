<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazebo Sim Backports Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-header: #1b263e;
            --border-color: #253552;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            
            --color-merged: #10b981;
            --color-open: #3b82f6;
            --color-closed: #f43f5e;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .last-updated {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }



        /* Controls */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
        }

        .filter-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background-color: var(--bg-header);
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .sort-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .sort-group select {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .sort-group select:focus {
            border-color: #3b82f6;
        }

        /* Table */
        .table-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--bg-header);
            padding: 1rem 1.25rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background-color 0.15s;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* PR info */
        .pr-info {
            max-width: 500px;
        }

        .pr-title-link {
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.975rem;
            display: block;
            margin-bottom: 0.35rem;
            transition: color 0.15s;
        }

        .pr-title-link:hover {
            color: #60a5fa;
        }

        .pr-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pr-number {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: #a78bfa;
        }

        .pr-author {
            font-weight: 500;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .badge:hover {
            transform: translateY(-1px);
        }

        .badge-merged {
            background-color: rgba(16, 185, 129, 0.12);
            color: var(--color-merged);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .badge-merged:hover {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .badge-open {
            background-color: rgba(59, 130, 246, 0.12);
            color: var(--color-open);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .badge-open:hover {
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
        }

        .badge-closed {
            background-color: rgba(244, 63, 94, 0.12);
            color: var(--color-closed);
            border: 1px solid rgba(244, 63, 94, 0.25);
        }

        .badge-closed:hover {
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.2);
        }

        .badge-none {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--color-open);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 5px rgba(59, 130, 246, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .branch-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .branch-label {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            display: inline-block;
            width: max-content;
            font-weight: 500;
        }

        .comment-cell {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-container">
                <h1>Gazebo Sim Backports Dashboard</h1>
                <div class="last-updated">
                    <span>Last updated: 2026-08-14 08:00:08 UTC</span>
                </div>
            </div>
        </header>



        <div class="controls-row">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by PR number, title, author...">
            </div>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                <div class="sort-group">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy" onchange="applySorting()">
                        <option value="mergeDate" selected>Merge Date (Newest)</option>
                        <option value="prNumber">PR Number (Highest)</option>
                        <option value="updateDate">Last Updated (Newest)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" onclick="setFilter('all', this)">All PRs</button>
                    <button class="filter-btn" onclick="setFilter('pending', this)">Pending Backports</button>
                    <button class="filter-btn" onclick="setFilter('completed', this)">Completed Backports</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Original PR</th>
                        
            <th>
                <div class="branch-header">
                    <span>gz-sim10</span>
                    <span class="branch-label" style="background-color: #9758E4; color: #ffffff;">
                        🪵 Jetty (10)
                    </span>
                </div>
            </th>
        

            <th>
                <div class="branch-header">
                    <span>gz-sim9</span>
                    <span class="branch-label" style="background-color: #d93f0b; color: #ffffff;">
                        🏛️ Ionic (9)
                    </span>
                </div>
            </th>
        

            <th>
                <div class="branch-header">
                    <span>gz-sim8</span>
                    <span class="branch-label" style="background-color: #cccccc; color: #111111;">
                        🎵 Harmonic (8)
                    </span>
                </div>
            </th>
        

            <th>
                <div class="branch-header">
                    <span>ign-gazebo6</span>
                    <span class="branch-label" style="background-color: #984304; color: #ffffff;">
                        🏯 Fortress (6)
                    </span>
                </div>
            </th>
        
                        <th>Comments</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        
        function setFilter(filter, element) {
            currentFilter = filter;
            
            // Update active button styling
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            applyFilters();
        }
        
        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                const category = row.getAttribute('data-category');
                
                const matchesSearch = text.includes(searchVal);
                let matchesFilter = true;
                
                if (currentFilter === 'pending') {
                    matchesFilter = (category === 'pending');
                } else if (currentFilter === 'completed') {
                    matchesFilter = (category === 'completed');
                }
                
                if (matchesSearch && matchesFilter) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
        
        function applySorting() {
            const sortBy = document.getElementById('sortBy').value;
            const tbody = document.getElementById('tableBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            
            rows.sort((a, b) => {
                let valA, valB;
                if (sortBy === 'mergeDate') {
                    valA = a.getAttribute('data-merged-at') || '';
                    valB = b.getAttribute('data-merged-at') || '';
                    return valB.localeCompare(valA);
                } else if (sortBy === 'prNumber') {
                    valA = parseInt(a.getAttribute('data-number') || '0');
                    valB = parseInt(b.getAttribute('data-number') || '0');
                    return valB - valA;
                } else if (sortBy === 'updateDate') {
                    valA = a.getAttribute('data-updated-at') || '';
                    valB = b.getAttribute('data-updated-at') || '';
                    return valB.localeCompare(valA);
                }
                return 0;
            });
            
            rows.forEach(row => tbody.appendChild(row));
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
    </script>
</body>
</html>
